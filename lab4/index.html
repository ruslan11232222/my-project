<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Список справ</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="js/storage.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/events.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Список справ (Варіант 1)</h1>
        
        <form id="todo-form" class="todo-form" novalidate>
            <div class="input-group">
                <input type="text" name="title" id="title" placeholder="Що потрібно зробити?" required minlength="3">
                <span class="error-msg"></span>
            </div>
            <button type="submit">Додати</button>
        </form>

        <div class="controls">
            <input type="text" id="search" placeholder="Пошук справ...">
            <button id="clear-storage" class="danger">Очистити все</button>
        </div>

        <div class="stats">
            Всього: <span id="total-count">0</span> | 
            Виконано: <span id="done-count">0</span> | 
            Залишилось: <span id="pending-count">0</span>
        </div>

        <ul class="todo-list" id="todo-list"></ul>
    </div>
</body>
</html>
