<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>blocks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-container">
        <div class="block block-1">1</div>
        <div class="middle-row">
            <div class="block block-5">5</div>
            <div class="block block-4">
                <div>
                    <h1>Засоби побудови веб-сторінок</h1>
                    <p>Перший абзац тексту. <b>жирний шрифт</b> та <i>курсив</i>.</p>
                    <p>Другий абзац. <span class="highlight"> виділення тексту</span>.</p>
                    
                    <p>Список технологій:</p>
                    <ul>
                        <li>Гіпертекстова розмітка (HTML)</li>
                        <li>Каскадні таблиці стилів (CSS)</li>
                    </ul>
                </div>
            </div>
            <div class="block block-2">2</div>
        </div>
        <div class="block block-3">3</div>
    </div>
</body>
</html>
